<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rueda de Hábitos</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <!-- Fuente Comfortaa -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Comfortaa', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 24px) 16px;
      overflow-x: hidden;
    }

    /* Cartel ¡SIU! animado */
    #siu-banner {
      position: fixed;
      top: 55px;
      left: 50%;
      transform: translateX(-50%) scale(0.2);
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #FFFFFF;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.95), 0 0 50px rgba(255, 255, 255, 0.5);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #siu-banner.show {
      transform: translateX(-50%) scale(1.15);
      opacity: 1;
    }

    header {
      width: 100%;
      max-width: 500px;
      text-align: center;
      margin-top: 6px;
      margin-bottom: 12px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .main-wrapper {
      width: 100%;
      max-width: 500px;
      position: relative;
    }

    /* Título de Hábitos Diarios con espacio de sobra */
    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-left: 6px;
      margin-bottom: 8px;
      color: #FFFFFF;
    }

    .spiral-container {
      width: 100%;
      position: relative;
      aspect-ratio: 1000 / 920;
    }

    svg.wheel-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* Inputs HTML integrados con precisión absoluta */
    .inputs-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .slot {
      position: absolute;
      left: 3%;
      width: 46%;
      height: 5%;
      display: flex;
      align-items: center;
      pointer-events: auto;
    }

    /* Coordenadas calculadas exactamente para los 5 carriles */
    .slot-1 { top: 14.5%; }
    .slot-2 { top: 19.5%; }
    .slot-3 { top: 24.5%; }
    .slot-4 { top: 29.5%; }
    .slot-5 { top: 34.5%; }

    .slot-num {
      width: 22px;
      font-size: clamp(0.72rem, 2.3vw, 0.88rem);
      font-weight: 700;
      color: #FFFFFF;
      flex-shrink: 0;
    }

    .slot-input {
      background: transparent;
      border: none;
      outline: none;
      color: #FFFFFF;
      font-family: 'Comfortaa', cursive, sans-serif;
      font-size: clamp(0.68rem, 2vw, 0.82rem);
      font-weight: 600;
      width: 100%;
      padding-left: 4px;
      user-select: text;
    }

    .slot-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
      font-style: italic;
    }

    /* Panel de marcado rápido */
    .quick-actions {
      width: 100%;
      max-width: 500px;
      margin-top: 14px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
    }

    .quick-title {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .quick-day-badge {
      background: #FFFFFF;
      color: #000000;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .habit-toggles {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .toggle-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      font-family: 'Comfortaa', cursive, sans-serif;
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-btn.done {
      background: rgba(255, 255, 255, 0.15);
      border-color: #FFFFFF;
    }

    .toggle-check {
      width: 20px;
      height: 20px;
      border: 1.5px solid #FFFFFF;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .toggle-btn.done .toggle-check {
      background: #FFFFFF;
      color: #000000;
    }

    /* Tabla resumen */
    .table-container {
      width: 100%;
      max-width: 500px;
      margin-top: 14px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1.5px solid #FFFFFF;
      text-align: center;
      font-size: 0.72rem;
    }

    th, td {
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 6px 4px;
    }

    th {
      font-weight: 700;
    }

    td input {
      background: transparent;
      border: none;
      outline: none;
      color: #FFFFFF;
      font-family: 'Comfortaa', cursive, sans-serif;
      text-align: center;
      width: 100%;
      font-size: 0.75rem;
      user-select: text;
    }

    .replay-btn {
      margin-top: 16px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.7);
      font-family: 'Comfortaa', cursive, sans-serif;
      font-size: 0.75rem;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="siu-banner">¡SIU!</div>

  <header>
    <h1>Rueda de Hábitos</h1>
  </header>

  <div class="main-wrapper">
    <div class="section-title">Hábitos Diarios</div>

    <div class="spiral-container">
      <svg class="wheel-svg" id="wheelSvg" viewBox="0 0 1000 920"></svg>
      
      <!-- Las 5 franjas para escribir, centradas verticalmente entre sus dos líneas -->
      <div class="inputs-layer">
        <div class="slot slot-1">
          <span class="slot-num">1.</span>
          <input type="text" class="slot-input" id="h-name-0" placeholder="Escribe tu hábito 1...">
        </div>
        <div class="slot slot-2">
          <span class="slot-num">2.</span>
          <input type="text" class="slot-input" id="h-name-1" placeholder="Escribe tu hábito 2...">
        </div>
        <div class="slot slot-3">
          <span class="slot-num">3.</span>
          <input type="text" class="slot-input" id="h-name-2" placeholder="Escribe tu hábito 3...">
        </div>
        <div class="slot slot-4">
          <span class="slot-num">4.</span>
          <input type="text" class="slot-input" id="h-name-3" placeholder="Escribe tu hábito 4...">
        </div>
        <div class="slot slot-5">
          <span class="slot-num">5.</span>
          <input type="text" class="slot-input" id="h-name-4" placeholder="Escribe tu hábito 5...">
        </div>
      </div>
    </div>
  </div>

  <!-- Panel de marcado rápido para el día de hoy -->
  <div class="quick-actions">
    <div class="quick-title">
      <span>Marcar día de hoy</span>
      <span class="quick-day-badge" id="currentDayBadge">Día --</span>
    </div>
    <div class="habit-toggles" id="togglesContainer"></div>
  </div>

  <!-- Tabla inferior -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 25%;"></th>
          <th>Hábito 1</th>
          <th>Hábito 2</th>
          <th>Hábito 3</th>
          <th>Hábito 4</th>
          <th>Hábito 5</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="font-weight: 700;">Meta del Mes</td>
          <td><input type="text" id="target-0" value="25"></td>
          <td><input type="text" id="target-1" value="25"></td>
          <td><input type="text" id="target-2" value="20"></td>
          <td><input type="text" id="target-3" value="20"></td>
          <td><input type="text" id="target-4" value="30"></td>
        </tr>
        <tr>
          <td style="font-weight: 700;">Días Logrados</td>
          <td id="achieved-0">0</td>
          <td id="achieved-1">0</td>
          <td id="achieved-2">0</td>
          <td id="achieved-3">0</td>
          <td id="achieved-4">0</td>
        </tr>
      </tbody>
    </table>
  </div>

  <button class="replay-btn" id="replayBtn">↻ Ver animación de entrada</button>

  <script>
    const HABIT_COUNT = 5;
    const DAYS_IN_MONTH = 31;
    const today = new Date();
    const currentDay = today.getDate();

    const meses = [
      'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
      'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
    ];
    const currentMonthName = meses[today.getMonth()];

    const defaultHabits = [
      "Tomar 2L de agua",
      "Entrenar 30 min",
      "Leer 15 páginas",
      "Cero azúcar refinada",
      "Dormir 8 horas"
    ];

    let habits = JSON.parse(localStorage.getItem('user_habits_names')) || defaultHabits;
    let habitsData = JSON.parse(localStorage.getItem('user_habits_data')) || 
      Array.from({ length: HABIT_COUNT }, () => Array(DAYS_IN_MONTH).fill(false));
    let targets = JSON.parse(localStorage.getItem('user_habits_targets')) || ["25", "25", "20", "20", "30"];

    // Configuración Geométrica de la Rueda (en sistema SVG 1000 x 920)
    const CX = 520;
    const CY = 520;
    const R_INNER = 160;
    const RING_THICKNESS = 46;
    const straightStartX = 25;
    const straightEndX = CX;

    // Conectar inputs de hábitos y metas
    for (let i = 0; i < HABIT_COUNT; i++) {
      const input = document.getElementById(`h-name-${i}`);
      input.value = habits[i] || '';
      input.addEventListener('input', (e) => {
        habits[i] = e.target.value;
        localStorage.setItem('user_habits_names', JSON.stringify(habits));
        renderQuickToggles();
      });

      const targetInput = document.getElementById(`target-${i}`);
      targetInput.value = targets[i] || '';
      targetInput.addEventListener('input', (e) => {
        targets[i] = e.target.value;
        localStorage.setItem('user_habits_targets', JSON.stringify(targets));
      });
    }

    document.getElementById('currentDayBadge').innerText = `Día ${currentDay}`;

    function triggerHaptic() {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(40);
      }
    }

    function showSiu() {
      const banner = document.getElementById('siu-banner');
      banner.classList.add('show');
      setTimeout(() => {
        banner.classList.remove('show');
      }, 700);
    }

    function renderQuickToggles() {
      const container = document.getElementById('togglesContainer');
      container.innerHTML = '';
      const dayIdx = Math.min(currentDay - 1, DAYS_IN_MONTH - 1);

      for (let i = 0; i < HABIT_COUNT; i++) {
        const isDone = habitsData[i][dayIdx];
        const btn = document.createElement('button');
        btn.className = `toggle-btn ${isDone ? 'done' : ''}`;
        btn.innerHTML = `
          <span><strong>${i + 1}.</strong> ${habits[i] || 'Hábito ' + (i + 1)}</span>
          <div class="toggle-check">${isDone ? '✓' : ''}</div>
        `;

        btn.addEventListener('click', () => {
          habitsData[i][dayIdx] = !habitsData[i][dayIdx];
          localStorage.setItem('user_habits_data', JSON.stringify(habitsData));
          
          if (habitsData[i][dayIdx]) {
            showSiu();
            triggerHaptic();
          }

          updateAchievedCounts();
          renderQuickToggles();
          renderSvg(1);
        });

        container.appendChild(btn);
      }
    }

    function updateAchievedCounts() {
      for (let i = 0; i < HABIT_COUNT; i++) {
        const count = habitsData[i].filter(Boolean).length;
        document.getElementById(`achieved-${i}`).innerText = count;
      }
    }

    // Renderizado SVG preciso
    function renderSvg(progress) {
      const svg = document.getElementById('wheelSvg');
      let html = '';

      // 1. Líneas rectas horizontales
      for (let i = 0; i <= HABIT_COUNT; i++) {
        const r = R_INNER + (HABIT_COUNT - i) * RING_THICKNESS;
        const y = CY - r;
        const curX2 = straightStartX + (straightEndX - straightStartX) * Math.min(1, progress * 2);

        html += `<line x1="${straightStartX}" y1="${y}" x2="${curX2}" y2="${y}" stroke="#FFFFFF" stroke-width="1.8" />`;
      }

      // 2. Mes dinámico al centro, en negrita y subrayado
      html += `
        <text x="${CX}" y="${CY - 6}" fill="#FFFFFF" font-size="34" font-weight="700" font-family="Comfortaa" text-anchor="middle" dominant-baseline="middle">
          ${currentMonthName}
        </text>
        <line x1="${CX - 85}" y1="${CY + 22}" x2="${CX + 85}" y2="${CY + 22}" stroke="#FFFFFF" stroke-width="2.6" />
      `;

      if (progress >= 0.3) {
        const spiralProgress = (progress - 0.3) / 0.7;
        const startAngle = -Math.PI / 2;
        const totalSweep = 2 * Math.PI * 0.75;
        const currentSweep = totalSweep * spiralProgress;
        const dayAngleStep = totalSweep / DAYS_IN_MONTH;

        // 3. Arcos concéntricos
        for (let i = 0; i <= HABIT_COUNT; i++) {
          const r = R_INNER + (HABIT_COUNT - i) * RING_THICKNESS;
          const endA = startAngle + currentSweep;
          const x1 = CX + r * Math.cos(startAngle);
          const y1 = CY + r * Math.sin(startAngle);
          const x2 = CX + r * Math.cos(endA);
          const y2 = CY + r * Math.sin(endA);
          const largeArc = currentSweep > Math.PI ? 1 : 0;

          html += `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2}" fill="none" stroke="#FFFFFF" stroke-width="1.8" />`;
        }

        // 4. Rayos divisores de días y números exteriores
        for (let d = 0; d <= DAYS_IN_MONTH; d++) {
          const a = startAngle + d * dayAngleStep;
          if (a > startAngle + currentSweep) break;

          const cos = Math.cos(a);
          const sin = Math.sin(a);
          const x1 = CX + R_INNER * cos;
          const y1 = CY + R_INNER * sin;
          const x2 = CX + (R_INNER + HABIT_COUNT * RING_THICKNESS) * cos;
          const y2 = CY + (R_INNER + HABIT_COUNT * RING_THICKNESS) * sin;

          html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#FFFFFF" stroke-width="1.4" />`;

          // Números de días
          if (d > 0) {
            const midA = startAngle + (d - 0.5) * dayAngleStep;
            const rNum = R_INNER + HABIT_COUNT * RING_THICKNESS + 25;
            const nx = CX + rNum * Math.cos(midA);
            const ny = CY + rNum * Math.sin(midA);

            html += `<text x="${nx}" y="${ny}" fill="#FFFFFF" font-size="16" font-weight="600" font-family="Comfortaa" text-anchor="middle" dominant-baseline="middle">${d}</text>`;
          }
        }

        // 5. Tics completados
        for (let h = 0; h < HABIT_COUNT; h++) {
          const rMid = R_INNER + (HABIT_COUNT - h - 0.5) * RING_THICKNESS;
          for (let d = 0; d < DAYS_IN_MONTH; d++) {
            if (habitsData[h][d]) {
              const midA = startAngle + (d + 0.5) * dayAngleStep;
              if (midA <= startAngle + currentSweep) {
                const tx = CX + rMid * Math.cos(midA);
                const ty = CY + rMid * Math.sin(midA);
                html += `<text x="${tx}" y="${ty + 1}" fill="#FFFFFF" font-size="22" font-weight="700" font-family="Comfortaa" text-anchor="middle" dominant-baseline="middle">✓</text>`;
              }
            }
          }
        }
      }

      svg.innerHTML = html;
    }

    // Animación de entrada
    let animProgress = 0;
    function runAnimation() {
      animProgress = 0;
      function step() {
        animProgress += 0.03;
        if (animProgress >= 1) {
          animProgress = 1;
          renderSvg(1);
        } else {
          renderSvg(animProgress);
          requestAnimationFrame(step);
        }
      }
      requestAnimationFrame(step);
    }

    document.getElementById('replayBtn').addEventListener('click', runAnimation);

    // Inicializar
    updateAchievedCounts();
    renderQuickToggles();
    runAnimation();
  </script>
</body>
</html>
